name: Release

# A new version ships in any of three ways:
#  1. A push to main whose package.json version has no release yet (bump the version in a commit).
#  2. Actions tab -> "Release" -> Run workflow -> pick patch/minor/major (bumps and releases).
#  3. Pushing a tag vX.Y.Z that matches package.json.
# Installed copies pick the new release up automatically through electron-updater.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  decide:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" != "push" ] || [ "${{ github.ref_type }}" = "tag" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          v=$(node -p "require('./package.json').version")
          if gh release view "v$v" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "v$v is already released; nothing to do"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$v has no release yet; building it"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: decide
    if: needs.decide.outputs.release == 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck and test
        run: |
          npm run typecheck
          npm test

      - name: Bump version
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version ${{ inputs.bump }} --no-git-tag-version
          git commit -am "Release v$(node -p "require('./package.json').version")"
          git push origin HEAD:main

      - name: Build
        run: npm run build

      # electron-builder creates the vX.Y.Z tag and release, and uploads the installer
      # plus latest.yml, which is what the in-app updater reads.
      - name: Package and publish to GitHub Releases
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
